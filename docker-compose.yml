services:
  postgres:
    image: postgres:16-alpine
    container_name: dzshopi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dzshopi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dzshopi"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      target: dev
    container_name: dzshopi_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - APP_NAME=DzShopi
      - DEBUG=true
      - VERSION=0.1.0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/dzshopi
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: